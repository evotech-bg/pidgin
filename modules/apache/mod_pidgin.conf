# mod_pidgin — Pidgin JSON compression for Apache httpd
#
# Load the module (adjust path as needed)
LoadModule pidgin_module modules/mod_pidgin.so

# Enable Pidgin compression globally
PidginEnable On

# Number of JSON responses to observe before building a profile
PidginLearnSamples 30

# Minimum response size in bytes (smaller responses are not compressed)
PidginMinSize 256

# Re-learn interval: check for schema drift every N requests
PidginEvolveInterval 500

# Serve profile JSON at /.well-known/pidgin/
<Location "/.well-known/pidgin">
    SetHandler pidgin-profile
</Location>

# Example: enable only for API routes
# <Location "/api">
#     PidginEnable On
#     PidginLearnSamples 50
#     PidginMinSize 128
# </Location>

# Example: disable for specific paths
# <Location "/api/health">
#     PidginEnable Off
# </Location>
