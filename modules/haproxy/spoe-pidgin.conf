# spoe-pidgin.conf — SPOE configuration for Pidgin JSON compression.
#
# This file defines the SPOE messages and events that HAProxy sends
# to the Pidgin SPOE agent. The agent observes JSON responses,
# learns schemas, and returns compressed bodies.
#
# Referenced by: haproxy.cfg (filter spoe engine pidgin config ...)

[pidgin]

# Connect to the Pidgin SPOE agent via TCP
spoe-agent pidgin-agent
    messages pidgin-request
    option   var-prefix pidgin
    timeout  hello      5s
    timeout  idle       30s
    timeout  processing 10s
    use-backend pidgin-spoe-backend

# Message sent on every HTTP response that has a JSON body.
# HAProxy sends the response body, path, and client headers to the agent.
# The agent may set txn.pidgin.body, txn.pidgin.encoding, txn.pidgin.ratio.
spoe-message pidgin-request
    args path=path content_type=res.hdr(content-type) body=res.body accept_encoding=req.hdr(accept-encoding)
    event on-http-response
