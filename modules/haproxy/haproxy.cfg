# haproxy.cfg — HAProxy configuration with Pidgin SPOE compression.
#
# Architecture:
#   Client -> HAProxy (port 8080) -> Backend (port 8000)
#                |
#                +-> SPOE agent (pidgin-spoe, TCP :12345)
#
# The SPOE filter intercepts JSON responses and sends them to the
# pidgin-spoe agent. If the agent returns a compressed body, HAProxy
# replaces the response.

global
    log stdout format raw local0
    maxconn 1024

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# ------------------------------------------------------------------ #
# SPOE agent backend (connects to the pidgin-spoe process)            #
# ------------------------------------------------------------------ #

backend pidgin-spoe-backend
    mode tcp
    server pidgin-agent pidgin-spoe:12345 check

# ------------------------------------------------------------------ #
# Frontend: incoming client requests                                   #
# ------------------------------------------------------------------ #

frontend http-in
    bind *:8080

    # Enable the SPOE filter for pidgin compression
    filter spoe engine pidgin config /etc/haproxy/spoe-pidgin.conf

    # Serve profile requests directly via the pidgin-spoe HTTP endpoint
    acl is_pidgin_profile path_beg /.well-known/pidgin/
    use_backend pidgin-profile-backend if is_pidgin_profile

    default_backend api-backend

# ------------------------------------------------------------------ #
# API backend (upstream application server)                            #
# ------------------------------------------------------------------ #

backend api-backend
    mode http
    server app backend:8000 check

    # After the SPOE agent processes the response, check if compression happened.
    # If txn.pidgin.encoding is set, replace the body with the compressed version.
    http-response set-header Content-Encoding %[var(txn.pidgin.encoding)] if { var(txn.pidgin.encoding) -m found }
    http-response set-header X-Pidgin-Ratio %[var(txn.pidgin.ratio)] if { var(txn.pidgin.ratio) -m found }
    http-response set-header Vary Accept-Encoding if { var(txn.pidgin.encoding) -m found }
    http-response set-body %[var(txn.pidgin.body)] if { var(txn.pidgin.body) -m found }

# ------------------------------------------------------------------ #
# Profile backend (pidgin-spoe HTTP server for /.well-known/pidgin)    #
# ------------------------------------------------------------------ #

backend pidgin-profile-backend
    mode http
    server pidgin-http pidgin-spoe:8880 check
