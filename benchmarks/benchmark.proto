syntax = "proto3";
package benchmark;

// === Users API ===
message User {
    int32 id = 1;
    string uuid = 2;
    string name = 3;
    string email = 4;
    string role = 5;
    optional string department = 6;
    bool is_active = 7;
    bool is_verified = 8;
    int32 login_count = 9;
    double storage_used_mb = 10;
    string created_at = 11;
    string last_login_at = 12;
    optional string avatar_url = 13;
    string locale = 14;
}

message UserList {
    repeated User users = 1;
}

// === Orders API (nested) ===
message OrderItem {
    string sku = 1;
    string name = 2;
    int32 quantity = 3;
    double unit_price = 4;
    double total = 5;
    string category = 6;
}

message Address {
    string line1 = 1;
    string city = 2;
    string postal_code = 3;
    string country = 4;
}

message Order {
    string order_id = 1;
    int32 customer_id = 2;
    string status = 3;
    string currency = 4;
    double subtotal = 5;
    double tax = 6;
    double shipping_cost = 7;
    double total = 8;
    repeated OrderItem items = 9;
    Address shipping_address = 10;
    string payment_method = 11;
    optional string carrier = 12;
    optional string tracking_number = 13;
    string created_at = 14;
    string updated_at = 15;
    optional string notes = 16;
}

message OrderList {
    repeated Order orders = 1;
}

// === Analytics Events ===
message Event {
    string event_id = 1;
    string session_id = 2;
    optional int32 user_id = 3;
    string event_type = 4;
    string page = 5;
    optional string referrer = 6;
    string browser = 7;
    string os = 8;
    string country = 9;
    int32 viewport_width = 10;
    int32 viewport_height = 11;
    int32 load_time_ms = 12;
    bool is_bot = 13;
    string timestamp = 14;
}

message EventList {
    repeated Event events = 1;
}
